<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %} | Ella's Writing</title>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="/assets/style.css">
    <meta name="color-scheme" content="dark light">
    <link rel="alternate" type="application/rss+xml" href="/rss.xml">
    <link rel="alternate" type="application/atom+xml" href="/atom.xml">
    {% block head %}{% endblock %}
</head>

<body>
    <header>
        <nav>
            <a href="/">Ella's Writing</a>
            <input type="checkbox" id="light" title="Light/dark mode theme toggle">
            <script>
                (() => {
                    // enhancement to load/store, inlined to avoid flash of wrong-theme
                    function lightToggle(e) {
                        let value = e.target.checked;
                        const media = window.matchMedia("(prefers-color-scheme: dark)");
                        value ^= media.matches;
                        window.localStorage.setItem("dark-mode", Boolean(value).toString());
                    }

                    const el = document.getElementById("light");

                    const media = window.matchMedia("(prefers-color-scheme: dark)");
                    const stored = window.localStorage.getItem("dark-mode");
                    if (stored != null) {
                        el.checked = (stored === "true") ^ media.matches;
                    }

                    el.addEventListener("change", lightToggle);
                })();
            </script>
        </nav>
        {% block header %}{% endblock %}
    </header>

    {% block body %}{% endblock %}

    <footer>
        <a href="/rss.xml">RSS</a>
        <a href="/atom.xml">Atom</a>
        <p>Ella's Writing &copy; 2026 by Ella is licensed under CC BY-SA-NC 4.0</p>
    </footer>
</body>

</html>
